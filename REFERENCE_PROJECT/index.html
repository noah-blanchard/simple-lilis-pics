<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lilis Pics — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0a0a0a',
          panel: '#141414',
          panel2: '#1c1c1c',
          line: '#262626',
          muted: '#9a9a9a',
          accent: '#f5e155',
        },
        fontFamily: {
          sans: ['"Hanken Grotesk"', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        borderRadius: {
          'card': '28px',
        }
      }
    }
  }
</script>

<style>
  html, body { background:#0a0a0a; color:#fafafa; }
  body { font-family:"Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  /* hide scrollbar on horizontal carousels */
  .no-scrollbar::-webkit-scrollbar { display:none; }
  .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

  /* huge display headline */
  .display {
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 0.95;
  }
  .display-xl {
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 0.95;
  }
  .tag-mono {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: #9a9a9a;
  }
  /* subtle grain on hero */
  .grain::after {
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  /* hover-zoom for image cards */
  .img-zoom { transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .group:hover .img-zoom { transform: scale(1.06); }

  /* hero entry animations */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .anim-fade-up   { opacity: 0; animation: fadeUp 1s cubic-bezier(.22,1,.36,1) forwards; }
  .anim-fade-down { opacity: 0; animation: fadeDown 0.9s cubic-bezier(.22,1,.36,1) forwards; }
  .anim-fade      { opacity: 0; animation: fadeIn 0.9s ease-out forwards; }
  .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; } .d4 { animation-delay: .6s; } .d5 { animation-delay: .75s; }

  /* marquee */
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { display: flex; gap: 3rem; white-space: nowrap; animation: marquee 40s linear infinite; }

  /* utility for the overlay watermark text at footer */
  .wm-text {
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 0.85;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,0.06);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="bg-ink text-white">
  <div id="root"></div>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
